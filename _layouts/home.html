---
layout: base
---

<div class="home">
  <div class="article">
    {{ content }}
  </div>

  {% if site.paginate %}
  {% assign posts = paginator.posts %}
  {% else %}
  {% assign posts = site.posts %}
  {% endif %}

  {%- if posts.size > 0 -%}
  <section class="mt-14 pt-9 border-t border-[var(--hairline)]" aria-labelledby="recent-writings-heading">
    <div class="flex items-baseline justify-between mb-3">
      <h2 id="recent-writings-heading" class="text-xs font-medium tracking-[0.12em] text-[var(--muted)]">
        最近文章
      </h2>
      <a href="{{ '/writings/' | relative_url }}" class="text-[13px] text-[var(--muted)] hover:text-[var(--ink)] transition-colors">
        全部 {{ site.posts.size }} 篇 →
      </a>
    </div>

    {% include post-list.html posts=posts limit=6 %}
  </section>
  {%- endif -%}
</div>
