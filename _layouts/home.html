---
layout: base
---

<div class="home">

  <div class="w-full md:w-9/12">
    <div class="article -mt-[5px]">
      {{ content }}
    </div>
  </div>

  {% if site.paginate %}
  {% assign posts = paginator.posts %}
  {% else %}
  {% assign posts = site.posts %}
  {% endif %}

  {%- if posts.size > 0 -%}
  <h2
    class="mt-16 mb-2 text-sm font-bold text-gray-400 dark:text-gray-500">最近文章</h2>

  {% include post-list.html posts=posts limit=3 %}

  <div class="mt-6">
    <a href="/writings/" class="link text-sm">全部文章 →</a>
  </div>
  {%- endif -%}

</div>
